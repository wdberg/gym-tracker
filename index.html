<style>
/* Layout: phone-first single column. One session per screen, bottom tab bar, big tap targets for use between sets.
   Concrete greys with a cool bias; signal orange for gym days, teal for at-work days.
   Colours can be overridden from the Setup tab (inline custom properties on <html>). */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#E2E6EB; --ink:#14181D; --muted:#586370; --line:#C9D0D8;
  --accent:#D1400E; --accent-ink:#FFFFFF; --work:#0B7983; --work-ink:#FFFFFF;
  --done:#2B7A4B; --short:#8A5A0B; --skip:#B3372F; --on-status:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mode:var(--accent); --mode-ink:var(--accent-ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --surface:#171C22; --surface2:#222930; --ink:#EDF0F3; --muted:#9AA5B1; --line:#2D3640;
    --accent:#FF6B3B; --accent-ink:#1B0A03; --work:#3EC1CC; --work-ink:#04191B;
    --done:#5CC384; --short:#E5B24C; --skip:#F07C74; --on-status:#0F1317; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C22; --surface2:#222930; --ink:#EDF0F3; --muted:#9AA5B1; --line:#2D3640;
  --accent:#FF6B3B; --accent-ink:#1B0A03; --work:#3EC1CC; --work-ink:#04191B;
  --done:#5CC384; --short:#E5B24C; --skip:#F07C74; --on-status:#0F1317; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:640px; margin:0 auto; padding-block:16px 104px; display:flex; flex-direction:column; gap:16px}
.app.is-work{--mode:var(--work); --mode-ink:var(--work-ink)}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mode); outline-offset:2px}

.topbar{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.brand{font:700 22px/1 var(--display); letter-spacing:.06em; text-transform:uppercase}
.sync{font-size:13px; color:var(--muted); text-align:right}
.eyebrow{font:600 13px/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.title{font:700 clamp(38px,11vw,56px)/.95 var(--display); text-transform:uppercase; letter-spacing:.01em; margin:6px 0 6px; text-wrap:balance; color:var(--ink)}
.sub{color:var(--muted); margin:0}
h2{font:700 24px/1.1 var(--display); text-transform:uppercase; letter-spacing:.03em; margin:0; text-wrap:balance}
h3{font:600 13px/1.2 var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0}

.daynav{display:grid; grid-template-columns:48px 1fr 48px; gap:8px; align-items:center}
.iconbtn{min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font-size:22px; line-height:1}
.iconbtn:disabled{opacity:.35; cursor:default}
.daynav .mid{text-align:center}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--mode); font-weight:600; text-decoration:underline; text-underline-offset:3px}

.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--surface2); border-radius:12px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; color:var(--muted); font-weight:600; min-height:46px; padding:8px; border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .18)}
.seg.status button[aria-pressed="true"][data-v="done"]{background:var(--done); color:var(--on-status)}
.seg.status button[aria-pressed="true"][data-v="short"]{background:var(--short); color:var(--on-status)}
.seg.status button[aria-pressed="true"][data-v="skip"]{background:var(--skip); color:var(--on-status)}
.seg.modes button[aria-pressed="true"][data-v="gym"]{background:var(--accent); color:var(--accent-ink)}
.seg.modes button[aria-pressed="true"][data-v="work"]{background:var(--work); color:var(--work-ink)}

.note{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mode); border-radius:10px; padding:12px 14px; margin:0}
.btnrow{display:flex; flex-wrap:wrap; gap:8px}
.btnp{min-height:48px; border:1px solid var(--line); background:var(--surface2); border-radius:10px; font-weight:600; padding:8px 14px}
.btnp.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btnp.danger{color:var(--skip)}
.btnp.sm{min-height:40px; padding:6px 12px; font-size:15px}
.btnp:disabled{opacity:.4; cursor:default}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px}

.list{display:flex; flex-direction:column; gap:8px}
.ex{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px}
.ex.is-done{background:color-mix(in srgb,var(--done) 14%,var(--surface)); border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.chk{width:34px; height:34px; border-radius:50%; border:2px solid var(--muted); background:transparent; display:grid; place-items:center; padding:0}
.chk[aria-pressed="true"]{background:var(--done); border-color:var(--done); color:var(--on-status)}
.chk[aria-pressed="true"]::after{content:"✓"; font-weight:700; font-size:18px; line-height:1}
.ex-name{font-weight:600; font-size:17px; line-height:1.2}
.ex-sr{font:700 24px/1.1 var(--display); color:var(--mode); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.ex-cue{font-size:14px; color:var(--muted); line-height:1.3}
.wt{display:flex; flex-direction:column; align-items:center; gap:2px}
.wt .wrap{display:flex; align-items:center; gap:6px}
.wt input{width:78px; min-height:46px; text-align:center; font:600 20px var(--body); border:1px solid var(--line); border-radius:10px; background:var(--bg); font-variant-numeric:tabular-nums}
.wt span{color:var(--muted); font-size:14px}
.wt small{font-size:12px; color:var(--muted); min-height:14px}

.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field.full{grid-column:1/-1}
.field label,.lbl{font:600 13px/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.field input,.field textarea,.field select{width:100%; min-height:46px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--bg); font-variant-numeric:tabular-nums}
.field textarea{min-height:92px; resize:vertical}
.check{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--ink)}
.check input{width:20px; height:20px; accent-color:var(--accent)}

.target{display:flex; flex-direction:column; gap:4px}
.target .big{font:700 40px/1 var(--display); color:var(--mode); font-variant-numeric:tabular-nums}

.weekrow{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:60px}
.weekrow.is-today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.weekrow .dow{font:700 24px/1 var(--display); text-transform:uppercase}
.weekrow .dn{font-size:12px; color:var(--muted)}
.weekrow .nm{font-weight:600}
.weekrow .tg{font-size:14px; color:var(--muted)}
.chip{font-size:13px; font-weight:600; padding:4px 10px; border-radius:99px; background:var(--surface2); color:var(--muted); white-space:nowrap; border:0}
.chip[data-v="done"]{background:var(--done); color:var(--on-status)}
.chip[data-v="short"]{background:var(--short); color:var(--on-status)}
.chip[data-v="skip"]{background:var(--skip); color:var(--on-status)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:2px}
.stat b{font:700 36px/1 var(--display); font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--muted)}

.grid{display:grid; grid-template-columns:34px repeat(7,minmax(0,1fr)); gap:5px; align-items:center}
.grid .hd{font-size:12px; text-align:center; color:var(--muted); font-weight:600}
.grid .wl{font:700 15px var(--display); color:var(--muted)}
.cell{aspect-ratio:1; max-width:100%; min-height:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; padding:0; font-variant-numeric:tabular-nums; color:var(--muted)}
.cell[data-v="done"]{background:var(--done); border-color:var(--done); color:var(--on-status)}
.cell[data-v="short"]{background:var(--short); border-color:var(--short); color:var(--on-status)}
.cell[data-v="skip"]{background:var(--skip); border-color:var(--skip); color:var(--on-status)}
.cell.future{opacity:.55}
.cell.today{outline:2px solid var(--accent); outline-offset:1px}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}

.lift{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:10px 0; border-top:1px solid var(--line); align-items:baseline}
.lift:first-of-type{border-top:0}
.lift b{font-variant-numeric:tabular-nums}
.up{color:var(--done); font-weight:600}
.empty{color:var(--muted); margin:0}

.sess{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
.sess header{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.sess .row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:8px 0; border-top:1px solid var(--line)}
.sess .row .sr{font:700 20px/1.1 var(--display); color:var(--mode); font-variant-numeric:tabular-nums; white-space:nowrap}
.sess .row .cue{grid-column:1/-1; font-size:14px; color:var(--muted); line-height:1.3}
.sess.work{--mode:var(--work)}
ul.plain{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}

/* Plan editor */
.edrow{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--bg)}
.edrow .top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.edrow .tools{display:flex; gap:4px}
.edrow .tools button{width:40px; height:40px; border:1px solid var(--line); background:var(--surface); border-radius:9px; font-size:16px}
.slot{display:grid; grid-template-columns:72px minmax(0,1fr); gap:10px; align-items:center}
.slot .d{font:700 20px/1 var(--display); text-transform:uppercase}
.slot .d small{display:block; font:500 12px var(--body); color:var(--muted); text-transform:none}
.weeks{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.weeks button{min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font:700 20px var(--display); font-variant-numeric:tabular-nums}
.weeks button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.presets{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px}
.preset{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:8px; font-weight:600}
.preset[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.preset .dots{display:flex; gap:4px}
.preset .dots i{width:20px; height:20px; border-radius:50%; border:1px solid rgb(0 0 0 / .15)}
.colorrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:6px 0; border-top:1px solid var(--line)}
.colorrow:first-child{border-top:0}
.colorrow input{width:56px; height:40px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:2px; cursor:pointer}
/* Timers */
.timer{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.timer .clock{font:700 48px/1 var(--display); font-variant-numeric:tabular-nums; color:var(--mode)}
.timer small{display:block; color:var(--muted); font-size:13px; margin-top:4px}
.restquick{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.restbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(70px + env(safe-area-inset-bottom,0px)); z-index:15; display:flex; align-items:center; gap:10px; background:var(--accent); color:var(--accent-ink); padding:8px 8px 8px 18px; border-radius:99px; box-shadow:0 6px 20px rgb(0 0 0 / .28); font-weight:600; max-width:calc(100% - 24px); white-space:nowrap}
.restbar .clock{font:700 28px/1 var(--display); font-variant-numeric:tabular-nums; min-width:62px}
.restbar button{min-height:40px; border:1.5px solid currentColor; background:transparent; color:inherit; border-radius:99px; padding:4px 14px; font-weight:600}
.restbar.done{background:var(--done); color:var(--on-status)}
body.resting .app{padding-bottom:170px}
.tpill{border:0; cursor:pointer; background:var(--accent); color:var(--accent-ink); font-variant-numeric:tabular-nums}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:15px; z-index:20; max-width:calc(100% - 32px)}

.howbtn{margin-left:6px; min-height:30px; font:600 12px var(--body,system-ui); letter-spacing:.05em; text-transform:uppercase; padding:3px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface2,#fff); color:var(--muted); cursor:pointer; vertical-align:middle}
.howbtn[aria-expanded="true"]{color:var(--ink); border-color:var(--accent,#D1400E)}
.how{background:var(--surface2,#fff); border:1px solid var(--line); border-radius:12px; padding:12px; margin:6px 0 10px}
.how .hsv{display:block; width:100%; max-height:150px}
.how .hsv.one{max-width:170px; margin:0 auto}
.hsv polyline{fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.hsv .bod,.hsv .leg{stroke:var(--ink)} .hsv .arm{stroke:var(--accent,#D1400E)} .hsv .far{stroke:var(--muted)}
.hsv .hd{fill:none; stroke:var(--ink); stroke-width:3} .hsv .hp{fill:var(--line)} .hsv .kb{fill:var(--ink)}
.hsv .hb{stroke:var(--ink); stroke-width:3; stroke-linecap:round} .hsv .fl{stroke:var(--line); stroke-width:2} .hsv .fn{font:700 11px system-ui; fill:var(--muted)}
.how ol{margin:10px 0 6px; padding-left:20px; font-size:15px; line-height:1.4}
.how .tip{font-size:14px; color:var(--muted); margin:6px 0}
.how .vid{display:inline-block; margin-top:4px; font-weight:600; color:var(--accent,#D1400E)}

.musicrow{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 0 12px}
.musicbtn{display:inline-flex; align-items:center; min-height:40px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--surface2,#fff); color:var(--ink); font-weight:600; text-decoration:none}
.musicedit{background:var(--surface2,#fff); border:1px solid var(--line); border-radius:12px; padding:12px; margin:2px 0 12px; display:flex; flex-direction:column; gap:10px}
.musicedit label{font:600 13px/1.2 var(--body,system-ui); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.musicedit input{width:100%; min-height:46px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--bg)}

.xdone{margin:8px 0}
.xdone[aria-pressed="true"]{background:var(--done,#2e7d32); color:#fff; border-color:transparent}

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
}
nav.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
nav.tabs a{display:flex; justify-content:center; align-items:center; min-height:48px; border-radius:10px; text-decoration:none; color:var(--muted); font:700 13px var(--display); letter-spacing:.01em; text-transform:uppercase; text-align:center}
nav.tabs a[aria-current="page"]{color:var(--ink); background:var(--surface2); box-shadow:inset 0 -3px 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){ .chk,.cell,.seg button{transition:background .15s,border-color .15s} }
</style>

<script>

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/86400000)}
var TODAY=fmt(new Date());
function dShort(s){return parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}
function dLong(s){return parse(s).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'})}
function wd(s){return parse(s).toLocaleDateString('en-AU',{weekday:'short'})}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}

/* ---------- default program (your original 12-week trek block) ---------- */
function x(id,n,sr,cue,nw){return {id:id,n:n,sr:sr,cue:cue,nw:!!nw}}
var DEFAULT={
 v:2, name:'Trek Training', start:'2026-11-09', weeks:12,
 week:['A','run','B','rec','C','long','walk'],
 routines:{
  A:{gym:{name:'Full Body A',dur:'45–60 min',ex:[
    x('gA1','Squat','3 × 6–8','Brace, knees track over toes, depth you control.'),
    x('gA2','Bench press or push-ups','3 × 6–10','Shoulder blades back, elbows about 45°.'),
    x('gA3','Romanian deadlift','3 × 8','Soft knees, hips back, bar close, flat back.'),
    x('gA4','Row','3 × 8–12','Pull to the lower ribs, no swinging.'),
    x('gA5','Calf raises','3 × 12–15','Full stretch at the bottom, pause at the top.'),
    x('gA6','Plank','3 × 30–60 sec','Ribs down, glutes on, one straight line.',1)]},
   work:{name:'Calisthenics + Kettlebell A',dur:'30–45 min',ex:[
    x('wA1','Kettlebell goblet squat','3 × 10','Bell at the chest, elbows inside the knees.'),
    x('wA2','Push-ups','3 × 8–15','Body in one line, chest to a fist height.',1),
    x('wA3','Kettlebell Romanian deadlift','3 × 10','Hinge back, bell slides down the legs.'),
    x('wA4','Inverted row or pull-ups','3 × 6–10','Body straight, pull chest to the bar.',1),

function normalize(c){
  var o=clone(DEFAULT); if(!c||typeof c!=='object') return o;
  ['name','start','weeks','week','routines','cardio','recovery','focus','theme','preset','mode','u','music','rest','autoRest','sound','soundType','volume','countdown'].forEach(function(k){ if(c[k]!==undefined) o[k]=c[k] });
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.start)) o.start=DEFAULT.start;
  o.weeks=Math.min(12,Math.max(2,parseInt(o.weeks,10)||12));
  if(!Array.isArray(o.week)||o.week.length!==7) o.week=DEFAULT.week.slice();
  if(!o.routines||typeof o.routines!=='object') o.routines=clone(DEFAULT.routines);
  ['run','long','walk'].forEach(function(k){ if(!o.cardio[k]) o.cardio[k]=clone(DEFAULT.cardio[k]) });

}

          }

var SB=null, sbUser=null, sbStatus='ok', lastSync=0, pulling=false;

function pushLog(date){
  var v=ver[date], data=clone(state.logs[date]||{});
  queues[date]=(queues[date]||Promise.resolve()).then(function(){
    return SB.from('logs').upsert({user_id:sbUser.id,day:date,data:data,updated_at:new Date().toISOString()},{onConflict:'user_id,day'});
  }).then(function(r){ if(r&&r.error) throw r.error; if(ver[date]===v) delete dirty[date]; lastSync=Date.now(); sbMark('ok') },function(){sbMark('error')})
    .catch(function(){sbMark('error')});
}
function pushCfg(){
  var v=cfgVer, body={plan:clone(cfg),k14:k14get(),u:cfg.u||Date.now()};
  cfgQueue=cfgQueue.then(function(){
    return SB.from('settings').upsert({user_id:sbUser.id,data:body,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  }).then(function(r){ if(r&&r.error) throw r.error; cfgSaved=Math.max(cfgSaved,v); lastSync=Date.now(); sbMark('ok') })
    .catch(function(){sbMark('error')});
}
// Two-way merge: for each day the most recent edit wins (by its _u timestamp).
function pull(){
  if(!sbOn()||pulling) return; pulling=true; sbMark('busy');
  Promise.all([SB.from('logs').select('day,data'),SB.from('settings').select('data').maybeSingle()]).then(function(res){
    var lr=res[0], sr=res[1]; if(lr.error) throw lr.error; if(sr.error) throw sr.error;
    var remote={}, changed=false;
    (lr.data||[]).forEach(function(r){ if(/^\d{4}-\d{2}-\d{2}$/.test(r.day)) remote[r.day]=r.data||{} });
    Object.keys(remote).forEach(function(d){ if(dirty[d]) return; var loc=state.logs[d];
      if(!loc||(remote[d]._u||0)>(loc._u||0)){state.logs[d]=remote[d]; changed=true} });
    Object.keys(state.logs).forEach(function(d){ var loc=state.logs[d], rem=remote[d];
      if(!hasContent(loc)&&!loc.mode) return;
      if(!rem||(loc._u||0)>(rem._u||0)||dirty[d]){ if(!loc._u) loc._u=1; ver[d]=(ver[d]||0)+1; dirty[d]=true; pushLog(d) } });
    var rd=sr.data&&sr.data.data;
    if(rd&&rd.plan&&(rd.u||0)>(cfg.u||0)&&cfgVer===cfgSaved){
      cfg=normalize(rd.plan); cfg.u=rd.u; try{localStorage.setItem(CFG_LS,JSON.stringify(cfg))}catch(e){}
      if(rd.k14&&typeof rd.k14==='object') k14set(rd.k14); applyTheme(); state.sel=clamp(state.sel); changed=true;
    } else if(!rd||(cfg.u||0)>(rd.u||0)) pushCfg();
    persistLocal(); lastSync=Date.now(); pulling=false; sbMark('ok');
    if((changed||state.tab==='setup')&&!typing()&&!state.edit) render();
  }).catch(function(){pulling=false; sbMark('error')});
}
function startSync(){
  try{
    if(window.claude||!window.supabase||!window.GT_SYNC) return;
    SB=window.supabase.createClient(window.GT_SYNC.url,window.GT_SYNC.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    SB.auth.getSession().then(function(r){ var s=r&&r.data&&r.data.session; if(s&&!sbUser){sbUser=s.user; pull()} if(!typing()) render() });
    SB.auth.onAuthStateChange(function(ev,session){
      var was=!!sbUser; sbUser=session?session.user:null;
      if(!was&&sbUser) pull();
      if(was!==!!sbUser&&!typing()) render(); setSync();
    });
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) pull() });
    window.addEventListener('online',pull);
    setInterval(function(){ if(!document.hidden) pull() },120000);
  }catch(e){SB=null}
}

function lum(hex){var h=String(hex).replace('#',''); if(h.length===3) h=h.replace(/./g,'$&$&');

var THEME_VARS=['--accent','--accent-ink','--work','--work-ink','--bg','--surface','--surface2','--ink','--muted','--line','--done','--short','--skip','--on-status','color-scheme'];

function howFor(name){
  var n=String(name).toLowerCase();
  for(var i=0;i<HOW.length;i++) if(HOW[i].re.test(n)) return HOW[i];
  return null;
}
function howPanel(h,name){
  var q=encodeURIComponent('how to '+String(name).replace(/\(.*?\)/g,'').trim()+' exercise form');
  return '<div class="how">'+(h.p?hfigure(h.p,h.mode):'<p class="sub">Picture not available for this one. Follow the steps below.</p>')
   +'<ol>'+h.s.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'
   +'<p class="tip"><b>Avoid:</b> '+esc(h.tip)+'</p>'
   +'<a class="vid" href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">Watch a video</a></div>';
}
function addHow(){
  var els=document.querySelectorAll('#app .ex-name');
  for(var i=0;i<els.length;i++){
    var el=els[i]; if(el.querySelector('.howbtn')) continue;
    var h=howFor(el.textContent); if(!h) continue;
    var b=document.createElement('button'); b.className='howbtn'; b.type='button'; b.setAttribute('data-act','how'); b.setAttribute('data-k',h.k); b.setAttribute('aria-expanded','false'); b.textContent='How to';
    el.appendChild(document.createTextNode(' ')); el.appendChild(b);
  }
}
function toggleHow(b){
  var box=b.closest('.ex,.row'); if(!box) return;
  var nx=box.nextElementSibling;
  if(nx&&nx.classList.contains('how')){nx.remove(); b.setAttribute('aria-expanded','false'); return}
  var h=null; for(var i=0;i<HOW.length;i++) if(HOW[i].k===b.getAttribute('data-k')) h=HOW[i];
  if(!h) return;
  var name=b.parentNode.textContent.replace(/\s*How to\s*$/,'');
  var d=document.createElement('div'); d.innerHTML=howPanel(h,name); var panel=d.firstChild; panel.style.gridColumn='1 / -1';
  box.parentNode.insertBefore(panel,box.nextSibling); b.setAttribute('aria-expanded','true');
}

/* ---------- extra sessions (yoga, quick, 14-day) logged to the tracker ---------- */
function xList(date){return (L(date).x)||[]}
function xHas(date,k){return xList(date).some(function(e){return e.k===k})}
function xSet(date,k,info){
  var l=W(date), a=l.x||[], i=-1; a.forEach(function(e,n){if(e.k===k) i=n});
  if(info){ if(i<0) a.push(info) } else if(i>-1) a.splice(i,1);
  if(a.length) l.x=a; else delete l.x;
  touch(date);
}
function xBtn(q){
  var k=(q.lv?'y:':'q:')+q.n, on=xHas(TODAY,k);
  return '<button class="btnp xdone" data-act="xdone" data-k="'+esc(k)+'" data-n="'+esc(q.n)+'" data-c="'+(q.lv?'Yoga':'Quick')+'" data-m="'+(parseInt(q.d,10)||0)+'" aria-pressed="'+on+'">'+(on?'✓ Done today':'Mark done today')+'</button>';
}
function xAll(){
  var r={n:0,m:0,by:{},list:[]};
  Object.keys(state.logs).forEach(function(d){ xList(d).forEach(function(e){ r.n++; r.m+=e.m||0; r.by[e.c]=(r.by[e.c]||0)+1; r.list.push({d:d,e:e}) }) });
  r.list.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  return r;
}
function xToday(date){
  var a=xList(date); if(!a.length) return '';
  return '<div class="panel"><h2>Extra sessions logged</h2>'+a.map(function(e){
    return '<div class="lift"><span>'+esc(e.c)+' · '+esc(e.n)+(e.m?' · '+e.m+' min':'')+'</span><button class="linkbtn" data-act="xrm" data-k="'+esc(e.k)+'" data-d="'+date+'">Remove</button></div>'}).join('')+'</div>';
}
function xProgress(x){
  var h='<div class="panel"><h2>Extra sessions</h2>';
  if(!x.n) return h+'<p class="empty">Tap "Mark done today" on a yoga flow, quick session or 14-day plan day and it shows up here.</p></div>';
  h+='<div class="lift"><span>Total</span><b>'+x.n+'</b></div>'+Object.keys(x.by).sort().map(function(c){return '<div class="lift"><span>'+esc(c)+'</span><b>'+x.by[c]+'</b></div>'}).join('');
  h+='<h3 style="margin:10px 0 2px;font-size:14px;color:var(--muted)">Most recent</h3>'+x.list.slice(0,8).map(function(o){return '<div class="lift"><span>'+esc(dShort(o.d))+' · '+esc(o.e.n)+'</span><b>'+esc(o.e.c)+'</b></div>'}).join('');
  return h+'</div>';
}

/* ---------- timers: workout timer + rest timer ---------- */
var TM_LS='gt-timer.v1', RS_LS='gt-rest.v1';
function lsJ(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{}}catch(e){return {}}}
function lsS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function tmGet(){return lsJ(TM_LS)}
function tmElapsed(t){t=t||tmGet(); return (t.acc||0)+(t.start?Date.now()-t.start:0)}
function tmActive(t){t=t||tmGet(); return !!(t.start||t.acc)}
function clock(ms){var s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+pad(m):m)+':'+pad(x)}
function restSecs(){return parseInt(cfg.rest,10)||90}
function tmStart(){var t=tmGet(); if(!t.date) t.date=state.sel; t.start=Date.now(); lsS(TM_LS,t); wakeOn(); render()}
function tmPause(){var t=tmGet(); if(t.start){t.acc=(t.acc||0)+Date.now()-t.start; t.start=null; lsS(TM_LS,t)} wakeOff(); render()}
function tmReset(){lsS(TM_LS,{}); wakeOff(); render()}
function tmFinish(){
  var t=tmGet(), ms=tmElapsed(t), d=t.date||state.sel;
  if(ms<1000){tmReset(); return}
  var l=W(d); l.minutes=String(Math.max(1,Math.round(ms/60000))); touch(d);
  lsS(TM_LS,{}); wakeOff(); restStop(); render(); toast('Logged '+l.minutes+' min on '+dShort(d));
}
function timerPanel(date){
  var t=tmGet(), on=!!t.start, act=tmActive(t), other=act&&t.date&&t.date!==date;
  var btns=!act?'<button class="btnp primary" data-act="tm-start">Start workout</button>'

var SOUNDS=[['beep','Beep'],['chime','Chime'],['bell','Bell'],['boxing','Boxing bell'],['whistle','Whistle'],['buzzer','Buzzer'],['off','Off']];
function soundType(){ if(cfg.soundType) return cfg.soundType; return cfg.sound===false?'off':'beep' }
function soundVol(){ var v=parseInt(cfg.volume,10); return isNaN(v)?80:Math.min(100,Math.max(10,v)) }
function tone(out,f,st,dur,wave,peak,fEnd){
  var o=actx.createOscillator(), g=actx.createGain(); o.type=wave||'sine';
  o.frequency.setValueAtTime(f,st); if(fEnd) o.frequency.exponentialRampToValueAtTime(fEnd,st+dur);
  o.connect(g); g.connect(out);
  g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(peak,st+0.015); g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
  o.start(st); o.stop(st+dur+0.05);
}
function strike(out,f,st,len,peak){ // bell: a fundamental plus fading overtones
  tone(out,f,st,len,'sine',peak); tone(out,f*2.76,st,len*0.6,'sine',peak*0.35); tone(out,f*5.4,st,len*0.3,'sine',peak*0.15);

function playSound(type){
  type=type||soundType(); if(type==='off'||!actx) return;
  try{
    var out=actx.createGain(), t=actx.currentTime+0.02; out.gain.value=soundVol()/100*0.9; out.connect(actx.destination);
    if(type==='beep') [0,0.35,0.7].forEach(function(d){tone(out,880,t+d,0.25,'sine',0.6)});
    else if(type==='chime') [1046.5,1318.5,1568,2093].forEach(function(f,i){tone(out,f,t+i*0.14,0.9,'sine',0.45)});
    else if(type==='bell'){strike(out,660,t,1.8,0.6); strike(out,660,t+0.9,1.8,0.5)}
    else if(type==='boxing') [0,0.22,0.44].forEach(function(d){strike(out,1046,t+d,0.6,0.55)});
    else if(type==='whistle') [0,0.4].forEach(function(d){tone(out,1600,t+d,0.3,'sine',0.5,2600)});
    else if(type==='buzzer') [0,0.5].forEach(function(d){tone(out,180,t+d,0.4,'square',0.25)});
  }catch(e){}
}

  else if(el.id==='set-autorest'){cfg.autoRest=el.checked; saveCfg()}

  else if(el.id==='set-vol'){cfg.volume=+el.value; saveCfg(); render(); unlockAudio(); playSound()}
  else if(el.id==='set-name'){cfg.name=el.value.trim()||'Gym Tracker'; saveCfg(); render()}
  else if(el.dataset&&el.dataset.color) render();
});
app.addEventListener('submit',function(ev){
  if(ev.target&&ev.target.id==='sb-form'){ev.preventDefault(); sbSignIn()}
  if(ev.target&&ev.target.id==='pw-form'){ev.preventDefault(); sbChangePw()}
});
document.getElementById('restbar').addEventListener('click',function(ev){var b=ev.target.closest('[data-act]'); if(!b) return; unlockAudio(); if(b.dataset.act==='rest-add') restAdd(15); else restStop()});
window.addEventListener('hashchange',route);

/* ---------- auto update (only the GitHub-hosted copy uses a service worker) ---------- */
var swReg=null, newWorker=null;
function applyUpdate(){ if(newWorker&&!typing()) newWorker.postMessage('SKIP_WAITING') }
function checkUpdate(manual){
  if(!swReg) return;
  swReg.update().then(function(){ if(manual&&!swReg.installing&&!swReg.waiting) toast('You have the latest version ('+APP_VERSION+')') },function(){ if(manual) toast('Could not check. Are you online?') });
}
try{
  var hosted=location.protocol==='https:'||location.hostname==='localhost';
  if('serviceWorker' in navigator&&hosted&&!window.claude&&window.top===window){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swReg=reg; if(state.tab==='setup') render();
      function track(w){ w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller){newWorker=w; applyUpdate()} }) }
      if(reg.waiting&&navigator.serviceWorker.controller){newWorker=reg.waiting; applyUpdate()}
      reg.addEventListener('updatefound',function(){ if(reg.installing) track(reg.installing) });
      document.addEventListener('visibilitychange',function(){ if(!document.hidden) reg.update().catch(function(){}) });
      setInterval(function(){reg.update().catch(function(){})},30*60*1000);
      document.addEventListener('focusout',function(){ setTimeout(applyUpdate,300) });
    }).catch(function(){});
    var reloading=false, hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!hadController){hadController=true; return} // first install, nothing to update
      if(reloading) return; reloading=true; try{sessionStorage.setItem('gt-updated','1')}catch(e){} location.reload() });
    try{ if(sessionStorage.getItem('gt-updated')){sessionStorage.removeItem('gt-updated'); setTimeout(function(){toast('Updated to version '+APP_VERSION)},400)} }catch(e){}
  }
}catch(e){}

applyTheme(); startSync(); route(); startDb(); restTick(true); if(tmGet().start) wakeOn();
})();
</script>
