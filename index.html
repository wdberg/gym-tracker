<title>Gym Guide & Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: phone-first single column. One session per screen, bottom tab bar, big tap targets for use between sets.
   Concrete greys with a cool bias; signal orange for gym days, teal for at-work days.
   Colours can be overridden from the Setup tab (inline custom properties on <html>). */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface2:#E2E6EB; --ink:#14181D; --muted:#586370; --line:#C9D0D8;
  --accent:#D1400E; --accent-ink:#FFFFFF; --work:#0B7983; --work-ink:#FFFFFF;
  --done:#2B7A4B; --short:#8A5A0B; --skip:#B3372F; --on-status:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mode:var(--accent); --mode-ink:var(--accent-ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1317; --surface:#171C22; --surface2:#222930; --ink:#EDF0F3; --muted:#9AA5B1; --line:#2D3640;
    --accent:#FF6B3B; --accent-ink:#1B0A03; --work:#3EC1CC; --work-ink:#04191B;
    --done:#5CC384; --short:#E5B24C; --skip:#F07C74; --on-status:#0F1317; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C22; --surface2:#222930; --ink:#EDF0F3; --muted:#9AA5B1; --line:#2D3640;
  --accent:#FF6B3B; --accent-ink:#1B0A03; --work:#3EC1CC; --work-ink:#04191B;
  --done:#5CC384; --short:#E5B24C; --skip:#F07C74; --on-status:#0F1317; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:640px; margin:0 auto; padding-block:16px 104px; display:flex; flex-direction:column; gap:16px}
.app.is-work{--mode:var(--work); --mode-ink:var(--work-ink)}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mode); outline-offset:2px}

.topbar{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.brand{font:700 22px/1 var(--display); letter-spacing:.06em; text-transform:uppercase}
.sync{font-size:13px; color:var(--muted); text-align:right}
.eyebrow{font:600 13px/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.title{font:700 clamp(38px,11vw,56px)/.95 var(--display); text-transform:uppercase; letter-spacing:.01em; margin:6px 0 6px; text-wrap:balance; color:var(--ink)}
.sub{color:var(--muted); margin:0}
h2{font:700 24px/1.1 var(--display); text-transform:uppercase; letter-spacing:.03em; margin:0; text-wrap:balance}
h3{font:600 13px/1.2 var(--body); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0}

.daynav{display:grid; grid-template-columns:48px 1fr 48px; gap:8px; align-items:center}
.iconbtn{min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font-size:22px; line-height:1}
.iconbtn:disabled{opacity:.35; cursor:default}
.daynav .mid{text-align:center}
.linkbtn{background:none; border:0; padding:4px 0; color:var(--mode); font-weight:600; text-decoration:underline; text-underline-offset:3px}

.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--surface2); border-radius:12px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; color:var(--muted); font-weight:600; min-height:46px; padding:8px; border-radius:9px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .18)}
.seg.status button[aria-pressed="true"][data-v="done"]{background:var(--done); color:var(--on-status)}
.seg.status button[aria-pressed="true"][data-v="short"]{background:var(--short); color:var(--on-status)}
.seg.status button[aria-pressed="true"][data-v="skip"]{background:var(--skip); color:var(--on-status)}
.seg.modes button[aria-pressed="true"][data-v="gym"]{background:var(--accent); color:var(--accent-ink)}
.seg.modes button[aria-pressed="true"][data-v="work"]{background:var(--work); color:var(--work-ink)}

.note{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--mode); border-radius:10px; padding:12px 14px; margin:0}
.btnrow{display:flex; flex-wrap:wrap; gap:8px}
.btnp{min-height:48px; border:1px solid var(--line); background:var(--surface2); border-radius:10px; font-weight:600; padding:8px 14px}
.btnp.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btnp.danger{color:var(--skip)}
.btnp.sm{min-height:40px; padding:6px 12px; font-size:15px}
.btnp:disabled{opacity:.4; cursor:default}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:14px}

.list{display:flex; flex-direction:column; gap:8px}
.ex{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px}
.ex.is-done{background:color-mix(in srgb,var(--done) 14%,var(--surface)); border-color:color-mix(in srgb,var(--done) 45%,var(--line))}
.chk{width:34px; height:34px; border-radius:50%; border:2px solid var(--muted); background:transparent; display:grid; place-items:center; padding:0}
.chk[aria-pressed="true"]{background:var(--done); border-color:var(--done); color:var(--on-status)}
.chk[aria-pressed="true"]::after{content:"✓"; font-weight:700; font-size:18px; line-height:1}
.ex-name{font-weight:600; font-size:17px; line-height:1.2}
.ex-sr{font:700 24px/1.1 var(--display); color:var(--mode); letter-spacing:.02em; font-variant-numeric:tabular-nums}
.ex-cue{font-size:14px; color:var(--muted); line-height:1.3}
.wt{display:flex; flex-direction:column; align-items:center; gap:2px}
.wt .wrap{display:flex; align-items:center; gap:6px}
.wt input{width:78px; min-height:46px; text-align:center; font:600 20px var(--body); border:1px solid var(--line); border-radius:10px; background:var(--bg); font-variant-numeric:tabular-nums}
.wt span{color:var(--muted); font-size:14px}
.wt small{font-size:12px; color:var(--muted); min-height:14px}

.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.field.full{grid-column:1/-1}
.field label,.lbl{font:600 13px/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.field input,.field textarea,.field select{width:100%; min-height:46px; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--bg); font-variant-numeric:tabular-nums}
.field textarea{min-height:92px; resize:vertical}
.check{display:flex; align-items:center; gap:8px; font-size:15px; color:var(--ink)}
.check input{width:20px; height:20px; accent-color:var(--accent)}

.target{display:flex; flex-direction:column; gap:4px}
.target .big{font:700 40px/1 var(--display); color:var(--mode); font-variant-numeric:tabular-nums}

.weekrow{display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:60px}
.weekrow.is-today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.weekrow .dow{font:700 24px/1 var(--display); text-transform:uppercase}
.weekrow .dn{font-size:12px; color:var(--muted)}
.weekrow .nm{font-weight:600}
.weekrow .tg{font-size:14px; color:var(--muted)}
.chip{font-size:13px; font-weight:600; padding:4px 10px; border-radius:99px; background:var(--surface2); color:var(--muted); white-space:nowrap; border:0}
.chip[data-v="done"]{background:var(--done); color:var(--on-status)}
.chip[data-v="short"]{background:var(--short); color:var(--on-status)}
.chip[data-v="skip"]{background:var(--skip); color:var(--on-status)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:2px}
.stat b{font:700 36px/1 var(--display); font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--muted)}

.grid{display:grid; grid-template-columns:34px repeat(7,minmax(0,1fr)); gap:5px; align-items:center}
.grid .hd{font-size:12px; text-align:center; color:var(--muted); font-weight:600}
.grid .wl{font:700 15px var(--display); color:var(--muted)}
.cell{aspect-ratio:1; max-width:100%; min-height:38px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-size:13px; font-weight:600; padding:0; font-variant-numeric:tabular-nums; color:var(--muted)}
.cell[data-v="done"]{background:var(--done); border-color:var(--done); color:var(--on-status)}
.cell[data-v="short"]{background:var(--short); border-color:var(--short); color:var(--on-status)}
.cell[data-v="skip"]{background:var(--skip); border-color:var(--skip); color:var(--on-status)}
.cell.future{opacity:.55}
.cell.today{outline:2px solid var(--accent); outline-offset:1px}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}

.lift{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:10px 0; border-top:1px solid var(--line); align-items:baseline}
.lift:first-of-type{border-top:0}
.lift b{font-variant-numeric:tabular-nums}
.up{color:var(--done); font-weight:600}
.empty{color:var(--muted); margin:0}

.sess{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:10px}
.sess header{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap}
.sess .row{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; padding:8px 0; border-top:1px solid var(--line)}
.sess .row .sr{font:700 20px/1.1 var(--display); color:var(--mode); font-variant-numeric:tabular-nums; white-space:nowrap}
.sess .row .cue{grid-column:1/-1; font-size:14px; color:var(--muted); line-height:1.3}
.sess.work{--mode:var(--work)}
ul.plain{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}

/* Plan editor */
.edrow{border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--bg)}
.edrow .top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; align-items:center}
.edrow .tools{display:flex; gap:4px}
.edrow .tools button{width:40px; height:40px; border:1px solid var(--line); background:var(--surface); border-radius:9px; font-size:16px}
.slot{display:grid; grid-template-columns:72px minmax(0,1fr); gap:10px; align-items:center}
.slot .d{font:700 20px/1 var(--display); text-transform:uppercase}
.slot .d small{display:block; font:500 12px var(--body); color:var(--muted); text-transform:none}
.weeks{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.weeks button{min-height:48px; border:1px solid var(--line); background:var(--surface); border-radius:10px; font:700 20px var(--display); font-variant-numeric:tabular-nums}
.weeks button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.presets{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px}
.preset{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:10px; text-align:left; display:flex; flex-direction:column; gap:8px; font-weight:600}
.preset[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.preset .dots{display:flex; gap:4px}
.preset .dots i{width:20px; height:20px; border-radius:50%; border:1px solid rgb(0 0 0 / .15)}
.colorrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:center; padding:6px 0; border-top:1px solid var(--line)}
.colorrow:first-child{border-top:0}
.colorrow input{width:56px; height:40px; border:1px solid var(--line); border-radius:10px; background:var(--bg); padding:2px; cursor:pointer}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-weight:600; font-size:15px; z-index:20; max-width:calc(100% - 32px)}

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
}
nav.tabs .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(6,1fr); gap:2px}
nav.tabs a{display:flex; justify-content:center; align-items:center; min-height:48px; border-radius:10px; text-decoration:none; color:var(--muted); font:700 14px var(--display); letter-spacing:.02em; text-transform:uppercase; text-align:center}
nav.tabs a[aria-current="page"]{color:var(--ink); background:var(--surface2); box-shadow:inset 0 -3px 0 var(--accent)}
@media (prefers-reduced-motion:no-preference){ .chk,.cell,.seg button{transition:background .15s,border-color .15s} }
</style>

function normalize(c){
  var o=clone(DEFAULT); if(!c||typeof c!=='object') return o;
  ['name','start','weeks','week','routines','cardio','recovery','focus','theme','preset','mode','u'].forEach(function(k){ if(c[k]!==undefined) o[k]=c[k] });
  if(!/^\d{4}-\d{2}-\d{2}$/.test(o.start)) o.start=DEFAULT.start;
  o.weeks=Math.min(12,Math.max(2,parseInt(o.weeks,10)||12));
  if(!Array.isArray(o.week)||o.week.length!==7) o.week=DEFAULT.week.slice();
  if(!o.routines||typeof o.routines!=='object') o.routines=clone(DEFAULT.routines);
  ['run','long','walk'].forEach(function(k){ if(!o.cardio[k]) o.cardio[k]=clone(DEFAULT.cardio[k]) });
  if(!Array.isArray(o.focus)||!o.focus.length) o.focus=DEFAULT.focus.slice();
  return o;
}
var CFG_LS='gymcfg.v1', cfg;

/* ---------- program helpers ---------- */
function S(){return cfg.start}
function DAYS(){return cfg.weeks*7}
function E(){return addDays(S(),DAYS()-1)}
function clamp(s){return s<S()?S():(s>E()?E():s)}
// Maps week w of the program onto a list of stages, so a 4-week program still builds from first to last stage.
function stageOf(list,w){var L=list.length; if(!L) return ''; if(cfg.weeks<=1||L===1) return list[0]; return list[Math.round((w-1)*(L-1)/(cfg.weeks-1))]}
function names(){
  var m={}; Object.keys(cfg.routines).forEach(function(k){var r=cfg.routines[k];
    (r.gym.ex||[]).forEach(function(e){m[e.id]=e.n}); (r.work&&r.work.ex||[]).forEach(function(e){m[e.id]=e.n+' (at work)'})});
  return m;
}
function slotLabel(key){
  if(cfg.routines[key]) return cfg.routines[key].gym.name;
  if(cfg.cardio[key]) return cfg.cardio[key].name;
  if(key==='rec') return cfg.recovery.name;
  return 'Rest day';
}
function plan(date){
  var i=diff(date,S()), w=Math.floor(i/7), d=((i%7)+7)%7, key=cfg.week[d];
  var p={i:i,week:w+1,dow:d,key:key,focus:stageOf(cfg.focus,w+1)};
  if(cfg.routines[key]){p.type='weights'; p.weights=true; p.r=cfg.routines[key]}
  else if(cfg.cardio[key]){var c=cfg.cardio[key]; p.type='cardio'; p.name=c.name; p.target=stageOf(c.targets,w+1); p.tips=c.tips}
  else if(key==='rec'){p.type='rec'; p.name=cfg.recovery.name; p.target='Easy movement'; p.tips=cfg.recovery.tips}
  else {p.type='rest'; p.name='Rest Day'; p.target='Recover'; p.tips='Full rest. A gentle walk is fine. Aim for 7–9 hours of sleep.'}
  return p;
}
function hasWork(p){return !!(p.r&&p.r.work&&p.r.work.ex&&p.r.work.ex.length)}
function modeOf(p,l){return p.weights&&l.mode==='work'&&hasWork(p)?'work':'gym'}
function sessOf(p,l){return p.weights?p.r[modeOf(p,l)]:null}

/* ---------- state + storage ---------- */
var LS='gymlog.v1';
var state={tab:'today',sel:clamp(TODAY),ptab:'routines',edit:null};
state.logs={};
try{var raw=localStorage.getItem(LS); if(raw) state.logs=JSON.parse(raw)||{}}catch(e){}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify(state.logs))}catch(e){}}
function L(date){return state.logs[date]||{}}
function W(date){return state.logs[date]||(state.logs[date]={})}
function hasContent(l){return !!(l&&(l.status||l.minutes||l.km||l.notes||(l.ex&&Object.keys(l.ex).length)))}

var db=null, col=null, cfgDoc=null, dirty={}, ver={}, timers={}, queues={}, firstReal=false, loadTimer=null, syncMode='local';
var cfgVer=0, cfgSaved=0, cfgTimer=null, cfgQueue=Promise.resolve();
function setSync(m){
  syncMode=m||syncMode; var el=document.getElementById('sync'); if(!el) return;
  var pending=Object.keys(dirty).length>0||cfgVer!==cfgSaved;
  if(!col&&sbOn()){el.textContent=sbStatus==='error'?'Offline. Will sync when you are back online.':(pending||sbStatus==='busy')?'Syncing…':'Synced'; return}
  var t = syncMode==='error'?'Could not save to the cloud. Kept on this device.'
        : syncMode==='local'?'Saved on this device'
        : syncMode==='slow'?'Cloud is slow to answer. Showing saved data.'
        : pending?'Saving…':'Saved';
  el.textContent=t;
}
function touch(date){
  if(state.logs[date]) state.logs[date]._u=Date.now();
  ver[date]=(ver[date]||0)+1; dirty[date]=true; persistLocal(); setSync();
  clearTimeout(timers[date]); timers[date]=setTimeout(function(){flush(date)},700);
}
function flush(date){
  if(!col&&sbOn()){pushLog(date); return}
  if(!col){delete dirty[date]; setSync('local'); return}
  var v=ver[date], data=JSON.parse(JSON.stringify(state.logs[date]||{})); data.date=date;
  queues[date]=(queues[date]||Promise.resolve()).then(function(){return col.doc('d-'+date).set(data)}).then(function(){
    if(ver[date]===v) delete dirty[date]; setSync(syncMode==='error'?'ok':undefined);
  },function(){setSync('error')});
}
function saveCfg(){
  cfgVer++; cfg.u=Date.now(); try{localStorage.setItem(CFG_LS,JSON.stringify(cfg))}catch(e){}
  setSync(); clearTimeout(cfgTimer);
  cfgTimer=setTimeout(function(){
    if(!cfgDoc&&sbOn()){pushCfg(); return}
    if(!cfgDoc){cfgSaved=cfgVer; setSync('local'); return}
    var v=cfgVer, body={json:JSON.stringify(cfg)};
    cfgQueue=cfgQueue.then(function(){return cfgDoc.set(body)}).then(function(){cfgSaved=Math.max(cfgSaved,v); setSync(syncMode==='error'?'ok':undefined)},function(){setSync('error')});
  },600);
}
function typing(){var a=document.activeElement; return !!a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')}
function startDb(){
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    window.claude.use('db').then(function(d){
      if(!d){setSync('local');return}
      db=d; col=db.collection('logs'); cfgDoc=db.collection('settings').doc('cfg'); setSync('ok');
      loadTimer=setTimeout(function(){setSync('slow')},10000);
      col.onSnapshot(function(snap){
        clearTimeout(loadTimer); var seen={};
        snap.docs.forEach(function(d){
          if(d.id.indexOf('d-')!==0) return; var date=d.id.slice(2); seen[date]=1;
          if(!dirty[date]) state.logs[date]=JSON.parse(JSON.stringify(d.data()||{}));
        });
        if(!snap.metadata.fromCache && !firstReal){
          firstReal=true;
          Object.keys(state.logs).forEach(function(date){ if(!seen[date]&&hasContent(state.logs[date])) touch(date) });
        }
        persistLocal(); setSync('ok'); if(!typing()&&!state.edit) render();
      },function(){setSync('error')});
      var cfgFirst=false;
      cfgDoc.onSnapshot(function(snap){
        var real=!(snap.metadata&&snap.metadata.fromCache);
        if(snap.exists){
          if(cfgVer===cfgSaved){
            try{var c=JSON.parse(snap.data().json||'null'); if(c){cfg=normalize(c); try{localStorage.setItem(CFG_LS,JSON.stringify(cfg))}catch(e){} applyTheme(); state.sel=clamp(state.sel); if(!typing()&&!state.edit) render()}}catch(e){}
          }
        } else if(real&&!cfgFirst){ saveCfg() } // first visit after the update: store this device's setup in the cloud
        if(real) cfgFirst=true;
      },function(){setSync('error')});
    },function(){setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- cross-device sync with Supabase (GitHub version) ---------- */
var SB=null, sbUser=null, sbStatus='ok', lastSync=0, pulling=false;
function sbOn(){return !!(SB&&sbUser)}
function sbMark(s){sbStatus=s; setSync()}
function pushLog(date){
  var v=ver[date], data=clone(state.logs[date]||{});
  queues[date]=(queues[date]||Promise.resolve()).then(function(){
    return SB.from('logs').upsert({user_id:sbUser.id,day:date,data:data,updated_at:new Date().toISOString()},{onConflict:'user_id,day'});
  }).then(function(r){ if(r&&r.error) throw r.error; if(ver[date]===v) delete dirty[date]; lastSync=Date.now(); sbMark('ok') },function(){sbMark('error')})
    .catch(function(){sbMark('error')});
}
function pushCfg(){
  var v=cfgVer, body={plan:clone(cfg),k14:k14get(),u:cfg.u||Date.now()};
  cfgQueue=cfgQueue.then(function(){
    return SB.from('settings').upsert({user_id:sbUser.id,data:body,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  }).then(function(r){ if(r&&r.error) throw r.error; cfgSaved=Math.max(cfgSaved,v); lastSync=Date.now(); sbMark('ok') })
    .catch(function(){sbMark('error')});
}
// Two-way merge: for each day the most recent edit wins (by its _u timestamp).
function pull(){
  if(!sbOn()||pulling) return; pulling=true; sbMark('busy');
  Promise.all([SB.from('logs').select('day,data'),SB.from('settings').select('data').maybeSingle()]).then(function(res){
    var lr=res[0], sr=res[1]; if(lr.error) throw lr.error; if(sr.error) throw sr.error;
    var remote={}, changed=false;
    (lr.data||[]).forEach(function(r){ if(/^\d{4}-\d{2}-\d{2}$/.test(r.day)) remote[r.day]=r.data||{} });
    Object.keys(remote).forEach(function(d){ if(dirty[d]) return; var loc=state.logs[d];
      if(!loc||(remote[d]._u||0)>(loc._u||0)){state.logs[d]=remote[d]; changed=true} });
    Object.keys(state.logs).forEach(function(d){ var loc=state.logs[d], rem=remote[d];
      if(!hasContent(loc)&&!loc.mode) return;
      if(!rem||(loc._u||0)>(rem._u||0)||dirty[d]){ if(!loc._u) loc._u=1; ver[d]=(ver[d]||0)+1; dirty[d]=true; pushLog(d) } });
    var rd=sr.data&&sr.data.data;
    if(rd&&rd.plan&&(rd.u||0)>(cfg.u||0)&&cfgVer===cfgSaved){
      cfg=normalize(rd.plan); cfg.u=rd.u; try{localStorage.setItem(CFG_LS,JSON.stringify(cfg))}catch(e){}
      if(rd.k14&&typeof rd.k14==='object') k14set(rd.k14); applyTheme(); state.sel=clamp(state.sel); changed=true;
    } else if(!rd||(cfg.u||0)>(rd.u||0)) pushCfg();
    persistLocal(); lastSync=Date.now(); pulling=false; sbMark('ok');
    if((changed||state.tab==='setup')&&!typing()&&!state.edit) render();
  }).catch(function(){pulling=false; sbMark('error')});
}
function startSync(){
  try{
    if(window.claude||!window.supabase||!window.GT_SYNC) return;
    SB=window.supabase.createClient(window.GT_SYNC.url,window.GT_SYNC.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    SB.auth.getSession().then(function(r){ var s=r&&r.data&&r.data.session; if(s&&!sbUser){sbUser=s.user; pull()} if(!typing()) render() });
    SB.auth.onAuthStateChange(function(ev,session){
      var was=!!sbUser; sbUser=session?session.user:null;
      if(!was&&sbUser) pull();
      if(was!==!!sbUser&&!typing()) render(); setSync();
    });
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) pull() });
    window.addEventListener('online',pull);
    setInterval(function(){ if(!document.hidden) pull() },120000);
  }catch(e){SB=null}
}
function syncPanel(){
  if(!SB) return '';
  if(sbUser) return '<div class="panel"><h2>Sync across devices</h2><p class="sub">Signed in as <b>'+esc(sbUser.email||'you')+'</b>. Your log, plan and colours stay the same on every device you sign in on.'+(lastSync?' Last synced at '+new Date(lastSync).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})+'.':'')+'</p>'
    +'<div class="btnrow"><button class="btnp sm" data-act="sb-sync">Sync now</button><button class="btnp sm" data-act="sb-out">Sign out</button></div></div>';
  return '<div class="panel"><h2>Sync across devices</h2><p class="sub">Sign in with your email and password. Your log, plan and colours then stay the same on every device you sign in on.</p>'
    +'<form id="sb-form" class="fields" autocomplete="on"><div class="field full"><label for="sb-email">Email</label><input id="sb-email" type="email" autocomplete="username" inputmode="email" required></div>'
    +'<div class="field full"><label for="sb-pass">Password</label><input id="sb-pass" type="password" autocomplete="current-password" required minlength="6"></div>'
    +'<div class="field full"><div class="btnrow"><button class="btnp primary" type="submit">Sign in</button><button class="btnp" type="button" data-act="sb-up">Create account</button></div></div></form>'
    +'<p class="sub" id="sb-msg" role="status"></p></div>';
}
function sbMsg(t){var m=document.getElementById('sb-msg'); if(m) m.textContent=t}
function sbCreds(){var e=document.getElementById('sb-email'), p=document.getElementById('sb-pass'); return {email:(e&&e.value||'').trim(),password:p&&p.value||''}}
function sbSignIn(){
  var c=sbCreds(); if(!c.email||!c.password){sbMsg('Enter your email and password.'); return}
  sbMsg('Signing in…');
  SB.auth.signInWithPassword(c).then(function(r){
    if(r.error) sbMsg(r.error.message==='Invalid login credentials'?'That email and password do not match. Check them and try again.':r.error.message);
    else toast('Signed in. Syncing your log.');
  },function(){sbMsg('Could not reach the sync server. Check your connection and try again.')});
}
function sbSignUp(){
  var c=sbCreds(); if(!c.email||c.password.length<6){sbMsg('Enter your email and a password of at least 6 characters.'); return}
  sbMsg('Creating your account…');
  SB.auth.signUp(c).then(function(r){
    if(r.error) sbMsg(r.error.message);
    else if(!r.data.session) sbMsg('Account created. Open the email we sent to confirm it, then sign in here.');
    else toast('Account created. Syncing your log.');
  },function(){sbMsg('Could not reach the sync server. Check your connection and try again.')});
}

/* ---------- colours ---------- */
function lum(hex){var h=String(hex).replace('#',''); if(h.length===3) h=h.replace(/./g,'$&$&');
  var c=[0,2,4].map(function(i){var v=parseInt(h.slice(i,i+2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
  return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]}
function readable(hex){return lum(hex)>0.42?'#14181D':'#FFFFFF'}
var THEME_VARS=['--accent','--accent-ink','--work','--work-ink','--bg','--surface','--surface2','--ink','--muted','--line','--done','--short','--skip','--on-status','color-scheme'];
function applyTheme(){
  var root=document.documentElement, st=root.style;
  if(cfg.mode==='light'||cfg.mode==='dark') root.setAttribute('data-theme',cfg.mode); else root.removeAttribute('data-theme');
  THEME_VARS.forEach(function(v){st.removeProperty(v)});
  var t=cfg.theme;
  if(t){
    var dark=lum(t.bg)<0.3;
    st.setProperty('--accent',t.accent); st.setProperty('--accent-ink',readable(t.accent));
    st.setProperty('--work',t.work); st.setProperty('--work-ink',readable(t.work));
    st.setProperty('--bg',t.bg); st.setProperty('--surface',t.surface); st.setProperty('--ink',t.ink);
    st.setProperty('--surface2','color-mix(in srgb,'+t.surface+' 86%,'+t.ink+')');
    st.setProperty('--line','color-mix(in srgb,'+t.bg+' 76%,'+t.ink+')');
    st.setProperty('--muted','color-mix(in srgb,'+t.ink+' 62%,'+t.bg+')');
    st.setProperty('--done',dark?'#5CC384':'#2B7A4B'); st.setProperty('--short',dark?'#E5B24C':'#8A5A0B'); st.setProperty('--skip',dark?'#F07C74':'#B3372F');
    st.setProperty('--on-status',dark?'#0F1317':'#FFFFFF'); st.setProperty('color-scheme',dark?'dark':'light');
  }
  var m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',t?t.accent:'#D1400E');
}
function currentColors(){
  if(cfg.theme) return clone(cfg.theme);
  var cs=getComputedStyle(document.documentElement), o={};
  COLOR_KEYS.forEach(function(k){o[k[0]]=cs.getPropertyValue('--'+k[0]).trim()});
  return o;
}

    rows.push([d,p.week,wd(d),s?s.name:p.name,p.weights?(mode==='work'?'At work':'Gym'):'',m[l.status]||'',l.minutes||'',l.km||'',wts,l.notes||'']);
  }
  save('gym-tracker-log.csv','text/csv',rows.map(function(r){return r.map(csvCell).join(',')}).join('\n'));
}
function backupText(){return JSON.stringify({app:'trek-training',version:2,logs:state.logs,plan:cfg,k14:k14get()},null,1)}
function exportJson(){save('gym-tracker-backup-'+TODAY+'.json','application/json',backupText())}
function bkNote(t){var m=document.getElementById('bkmsg'); if(m) m.textContent=t}
function copyBackup(){
  var t=backupText(), ta=document.getElementById('bktext'); if(ta){ta.hidden=false; ta.value=t; ta.focus(); ta.select()}
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){bkNote('Backup copied. Paste it into a note or email to yourself.')},function(){bkNote('Select the text below and copy it.')}); return} }catch(e){}
  try{ if(document.execCommand('copy')){bkNote('Backup copied. Paste it into a note or email to yourself.'); return} }catch(e){}
  bkNote('Select the text below and copy it.');
}
function importFile(f){
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result), lg=j&&j.logs; if(!lg||typeof lg!=='object') throw new Error('bad');
      var n=0; Object.keys(lg).forEach(function(d){ if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&typeof lg[d]==='object'){state.logs[d]=lg[d]; touch(d); n++} });
      if(j.plan){cfg=normalize(j.plan); applyTheme(); saveCfg(); state.sel=clamp(state.sel)}
      if(j.k14&&typeof j.k14==='object') k14set(j.k14);
      render(); bkNote('Imported '+n+' days'+(j.plan?' and your plan.':'.'));
    }catch(e){ bkNote('That file is not a gym tracker backup.') }
  };
  r.readAsText(f);
}

/* ---------- render + events ---------- */
var TABS=[['today','Today'],['week','Week'],['plan','Plan'],['progress','Stats'],['k14','14-Day'],['setup','Setup']];
var TAB_IDS=TABS.map(function(t){return t[0]});
function render(){
  var app=document.getElementById('app'), t=state.tab, sel=state.sel;
  var body=t==='week'?viewWeek():t==='plan'?viewPlan():t==='progress'?viewProgress():t==='k14'?view14():t==='setup'?viewSetup():viewToday();
  var p=plan(sel), workMode=t==='today'&&p.weights&&modeOf(p,L(sel))==='work';
  app.className='app'+(workMode||(t==='plan'&&state.edit&&state.edit.side==='work')?' is-work':'');
  app.innerHTML='<div class="topbar"><span class="brand">'+esc(cfg.name||'Gym Tracker')+'</span><span class="sync" id="sync" role="status"></span></div>'+body;
  document.getElementById('tabs').innerHTML=TABS.map(function(x){return '<a href="#'+x[0]+'"'+(x[0]===t?' aria-current="page"':'')+'>'+x[1]+'</a>'}).join('');
  setSync();
}
var toastT=null;
function toast(msg){var el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){el.hidden=true},2200)}
function go(tab){ if(location.hash==='#'+tab){state.tab=tab;render()} else location.hash=tab }
function route(){var h=location.hash.slice(1); if(h==='guide') h='plan'; state.tab=TAB_IDS.indexOf(h)>-1?h:'today'; render(); window.scrollTo(0,0)}
function newId(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newKey(){var abc='ABCDEFGHIJKLMNOPQRSTUVWXYZ'; for(var i=0;i<abc.length;i++) if(!cfg.routines[abc[i]]) return abc[i]; return 'R'+Date.now().toString(36).toUpperCase()}
function lines(id){return document.getElementById(id).value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}

var app=document.getElementById('app');
app.addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]'); if(!b||b.disabled) return; var a=b.dataset.act, date=state.sel, e=state.edit;
  if(a==='chk'){var lg=W(date); lg.ex=lg.ex||{}; var s=lg.ex[b.dataset.id]=lg.ex[b.dataset.id]||{}; s.d=!s.d; touch(date); render()}
  else if(a==='status'){var l=W(date); l.status=(l.status===b.dataset.v)?'':b.dataset.v; if(!l.status) delete l.status; touch(date); render()}
  else if(a==='mode'){var l2=W(date); l2.mode=b.dataset.v; touch(date); render()}
  else if(a==='day'){state.sel=clamp(addDays(date,+b.dataset.d)); render(); window.scrollTo(0,0)}
  else if(a==='today'){state.sel=clamp(TODAY); render()}
  else if(a==='wk'){state.sel=clamp(addDays(date,7*(+b.dataset.d))); render()}
  else if(a==='open'){state.sel=b.dataset.d; go('today')}
  else if(a==='ptab'){state.ptab=b.dataset.v; render()}
  /* routine editor */
  else if(a==='edit'){var r=cfg.routines[b.dataset.k], side=b.dataset.s, src=r[side]||{name:r.gym.name+' (at work)',dur:'30–45 min',ex:[]};
    state.edit={key:b.dataset.k,side:side,draft:clone(src)}; render(); window.scrollTo(0,0)}
  else if(a==='new-routine'){var k=newKey(); cfg.routines[k]={gym:{name:'New routine',dur:'45–60 min',ex:[]},work:{name:'New routine (at work)',dur:'30–45 min',ex:[]}};
    state.edit={key:k,side:'gym',draft:clone(cfg.routines[k].gym),isNew:true}; render(); window.scrollTo(0,0)}
  else if(a==='ed-add'){e.draft.ex.push({id:newId(),n:'',sr:'3 × 10',cue:'',nw:false}); render(); var inp=document.getElementById('ed-n-'+(e.draft.ex.length-1)); if(inp) inp.focus()}
  else if(a==='ed-del'){e.draft.ex.splice(+b.dataset.i,1); render()}
  else if(a==='ed-up'||a==='ed-down'){var i=+b.dataset.i, j=a==='ed-up'?i-1:i+1, xs=e.draft.ex; var tmp=xs[i]; xs[i]=xs[j]; xs[j]=tmp; render()}
  else if(a==='ed-copy'){var g=cfg.routines[e.key].gym; e.draft.ex=g.ex.map(function(x){var c=clone(x); c.id=newId(); return c}); render()}
  else if(a==='ed-save'){
    var dr=e.draft; dr.ex=dr.ex.filter(function(x){return x.n.trim()}); dr.name=dr.name.trim()||'Untitled routine';
    cfg.routines[e.key][e.side]=dr; saveCfg(); state.edit=null; state.ptab='routines'; render(); toast('Routine saved'); window.scrollTo(0,0)}
  else if(a==='ed-cancel'){ if(e.isNew) delete cfg.routines[e.key]; state.edit=null; render()}
  else if(a==='ed-remove'){e.confirmDel=true; render()}
  else if(a==='ed-remove-no'){e.confirmDel=false; render()}
  else if(a==='ed-remove-yes'){delete cfg.routines[e.key]; cfg.week=cfg.week.map(function(k){return k===e.key?'rest':k}); saveCfg(); state.edit=null; render(); toast('Routine deleted')}
  else if(a==='save-cardio'){
    ['run','long','walk'].forEach(function(k){var c=cfg.cardio[k]; c.name=document.getElementById('c-'+k+'-name').value.trim()||c.name; var tg=lines('c-'+k+'-tg'); if(tg.length) c.targets=tg; c.tips=document.getElementById('c-'+k+'-tips').value.trim()});
    cfg.recovery.name=document.getElementById('c-rec-name').value.trim()||cfg.recovery.name; cfg.recovery.items=lines('c-rec-items');
    var fc=lines('c-focus'); if(fc.length) cfg.focus=fc; saveCfg(); toast('Runs & walks saved')}
  /* setup */
  else if(a==='weeks'){cfg.weeks=+b.dataset.v; saveCfg(); state.sel=clamp(state.sel); render(); toast(cfg.weeks+'-week program')}
  else if(a==='start-today'){cfg.start=TODAY; saveCfg(); state.sel=clamp(TODAY); render(); toast('Program starts today')}
  else if(a==='preset'){var pr=PRESETS[b.dataset.v]; cfg.preset=b.dataset.v; cfg.theme=pr.t?clone(pr.t):null; saveCfg(); applyTheme(); render()}
  else if(a==='tmode'){cfg.mode=b.dataset.v; saveCfg(); applyTheme(); render()}
  else if(a==='check-update'){checkUpdate(true)}
  else if(a==='sb-up') sbSignUp();
  else if(a==='sb-sync') pull();
  else if(a==='sb-out'){SB.auth.signOut().then(function(){toast('Signed out. Your log stays on this device.')})}
  else if(a==='go-setup') go('setup');
  else if(a==='hint-off'){try{localStorage.setItem('gt-sync-hint','off')}catch(x){} render()}
  /* backup + 14-day */
  else if(a==='expcsv') exportCsv();
  else if(a==='expjson') exportJson();
  else if(a==='cpbk') copyBackup();
  else if(a==='imp') document.getElementById('impfile').click();
  else if(a==='k14'){ev.preventDefault(); var o=k14get(), ki=b.dataset.i; if(o[ki]) delete o[ki]; else o[ki]=1; k14set(o); if(sbOn()) saveCfg(); b.textContent=o[ki]?'Done':'Mark done'; b.style.opacity=o[ki]?'':'.7'; b.setAttribute('aria-pressed',!!o[ki]); var c=0; for(var q=0;q<14;q++) if(o[q]) c++; var nn=document.getElementById('k14n'); if(nn) nn.textContent=c+' of 14 days done.'}
});
app.addEventListener('input',function(ev){
  var el=ev.target, ds=el.dataset||{};
  if(ds.ed&&state.edit){state.edit.draft[ds.ed]=el.value; return}
  if(ds.ex&&state.edit){var x=state.edit.draft.ex[+ds.i]; if(ds.ex==='w') x.nw=!el.checked; else x[ds.ex]=el.value; return}
  if(ds.color){var t=currentColors(); t[ds.color]=el.value; cfg.theme=t; cfg.preset='custom'; applyTheme(); saveCfg(); return}
  var a=ds.act; if(!a) return; var date=state.sel, l=W(date);
  if(a==='w'){l.ex=l.ex||{}; var s=l.ex[ds.id]=l.ex[ds.id]||{}; s.w=el.value.trim(); if(!s.w&&!s.d) delete l.ex[ds.id]}
  else if(a==='min') l.minutes=el.value.trim();
  else if(a==='km') l.km=el.value.trim();
  else if(a==='notes') l.notes=el.value;
  else return;
  touch(date);
});
app.addEventListener('change',function(ev){
  var el=ev.target; if(!el) return;
  if(el.id==='impfile'&&el.files&&el.files[0]) importFile(el.files[0]);
  else if(el.dataset&&el.dataset.slot!==undefined){cfg.week[+el.dataset.slot]=el.value; saveCfg(); toast(wd(addDays(S(),+el.dataset.slot))+': '+slotLabel(el.value))}
  else if(el.id==='set-start'&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){cfg.start=el.value; saveCfg(); state.sel=clamp(state.sel); render(); toast('Start date changed')}
  else if(el.id==='set-name'){cfg.name=el.value.trim()||'Gym Tracker'; saveCfg(); render()}
  else if(el.dataset&&el.dataset.color) render();
});
app.addEventListener('submit',function(ev){ if(ev.target&&ev.target.id==='sb-form'){ev.preventDefault(); sbSignIn()} });
window.addEventListener('hashchange',route);

/* ---------- auto update (only the GitHub-hosted copy uses a service worker) ---------- */
var swReg=null, newWorker=null;
function applyUpdate(){ if(newWorker&&!typing()) newWorker.postMessage('SKIP_WAITING') }
function checkUpdate(manual){
  if(!swReg) return;
  swReg.update().then(function(){ if(manual&&!swReg.installing&&!swReg.waiting) toast('You have the latest version ('+APP_VERSION+')') },function(){ if(manual) toast('Could not check. Are you online?') });
}
try{
  var hosted=location.protocol==='https:'||location.hostname==='localhost';
  if('serviceWorker' in navigator&&hosted&&!window.claude&&window.top===window){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swReg=reg; if(state.tab==='setup') render();
      function track(w){ w.addEventListener('statechange',function(){ if(w.state==='installed'&&navigator.serviceWorker.controller){newWorker=w; applyUpdate()} }) }
      if(reg.waiting&&navigator.serviceWorker.controller){newWorker=reg.waiting; applyUpdate()}
      reg.addEventListener('updatefound',function(){ if(reg.installing) track(reg.installing) });
      document.addEventListener('visibilitychange',function(){ if(!document.hidden) reg.update().catch(function(){}) });
      setInterval(function(){reg.update().catch(function(){})},30*60*1000);
      document.addEventListener('focusout',function(){ setTimeout(applyUpdate,300) });
    }).catch(function(){});
    var reloading=false, hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){
      if(!hadController){hadController=true; return} // first install, nothing to update
      if(reloading) return; reloading=true; try{sessionStorage.setItem('gt-updated','1')}catch(e){} location.reload() });
    try{ if(sessionStorage.getItem('gt-updated')){sessionStorage.removeItem('gt-updated'); setTimeout(function(){toast('Updated to version '+APP_VERSION)},400)} }catch(e){}
  }
}catch(e){}

applyTheme(); startSync(); route(); startDb();
})();
</script>
