# Publishes the app to GitHub Pages on every push to the repository's default branch
# (main, or the app branch while that is still the default).
# Installed copies of the app pick up the new version automatically.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/clever-albattani-02sbmh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Pages only accepts deploys from the default branch, so skip pushes to the other one.
    if: github.ref_name == github.event.repository.default_branch
    # Set on the job (not the workflow) so a skipped run never cancels a real deploy.
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons vendor _site/
          # Unique id per deploy so the service worker sees a new version and updates the app.
          sed -i "s/__BUILD_ID__/${GITHUB_SHA::8}/" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
